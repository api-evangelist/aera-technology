apis:
- name: Aera Technology MCP Server
  description: 'An authenticated Model Context Protocol (MCP) endpoint served from
    Aera Technology''s own corporate WordPress host. Anonymous discovery works: the
    site publishes RFC 9728 protected-resource metadata and RFC 8414 authorization-server
    metadata advertising an authorization_code + PKCE (S256) flow with a single "mcp"
    scope. The tools/list method itself returns 401 mcp_unauthorized without a bearer
    token, so the live tool schemas could not be introspected anonymously. This is
    the corporate site''s MCP surface, not the Aera Decision Cloud product API.'
  humanURL: https://www.aeratechnology.com/
  baseURL: https://www.aeratechnology.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/aera-technology-mcp.yml
  - type: Authentication
    url: authentication/aera-technology-authentication.yml
  - type: OAuthScopes
    url: scopes/aera-technology-scopes.yml
  - type: ErrorCatalog
    url: errors/aera-technology-problem-types.yml
