aid: aera-technology
name: Aera Technology
description: 'Aera Technology is the Decision Intelligence company behind Aera Decision
  Cloud, an enterprise platform that digitizes, augments and automates operational
  decision making across supply chain, procurement, finance and commercial functions.
  The platform combines the Aera Decision Data Model, the Cortex AI/ML engine, multi-engine
  orchestration and agentic ambient intelligence with packaged Aera Skills, and is
  built and extended by customers through Aera Developer using low-code builders plus
  SQL, Java, Python and R. Aera Decision Cloud runs as a multi-tenant SaaS across US
  and EU regions; its developer documentation and API reference sit behind a customer
  SSO login, so no public OpenAPI or developer portal is available. The corporate site
  does publish an authenticated Model Context Protocol server discoverable through
  RFC 8414 / RFC 9728 well-known metadata.'
